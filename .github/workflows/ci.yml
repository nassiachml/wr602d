name: CI
on: [push, pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
      - name: Install dependencies
        run: cd symfony && composer install --no-progress --prefer-dist
      - name: PHPUnit
        run: cd symfony && php bin/phpunit
      - name: PHP_CodeSniffer (PSR-12)
        run: cd symfony && vendor/bin/phpcs --standard=PSR12 src/ tests/ || true
      - name: PHPStan
        run: cd symfony && vendor/bin/phpstan analyse src/ --memory-limit=256M --no-progress || true
      - name: PHPMD
        run: cd symfony && vendor/bin/phpmd src/ text cleancode,codesize,design,naming,unusedcode --exclude vendor || true

  cypress:
    runs-on: ubuntu-latest
    needs: php
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/app?serverVersion=8.0
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Symfony deps
        run: cd symfony && composer install --no-progress --prefer-dist --no-dev
      - name: Create DB and migrate
        run: |
          cd symfony && php bin/console doctrine:database:create --if-not-exists
          cd symfony && php bin/console doctrine:migrations:migrate --no-interaction
          cd symfony && php bin/console doctrine:fixtures:load --no-interaction
      - name: Install Cypress
        run: npm ci
      - name: Start server
        run: |
          cd symfony && APP_ENV=dev php -S localhost:8001 -t public &
          sleep 5
      - name: Cypress run
        run: npx cypress run --config baseUrl=http://localhost:8001
        continue-on-error: true
