framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    php_errors:
        log: true
    default_locale: fr
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['fr']
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    form: null
    csrf_protection: true
    validation:
        enable_attributes: true
